
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movie Land | Discover Movies</title>
<meta name="description" content="Discover movies, explore cinema and watch official trailers on Movie Land.">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#090b12;color:#fff;font-family:Arial,sans-serif}
header{height:75px;display:flex;align-items:center;justify-content:space-between;padding:0 7%;background:#10131d;border-bottom:1px solid #292d3b;position:sticky;top:0;z-index:10}
.logo{font-size:25px;font-weight:900;color:#f5b928}
.logo span{color:white}
nav{display:flex;gap:22px}
nav a{color:#ddd;text-decoration:none;font-size:14px}
nav a:hover{color:#f5b928}
.hero{padding:75px 8%;min-height:340px;background:linear-gradient(90deg,#11131d 15%,#11131dcc 60%,#11131d55),url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=1400') center/cover}
.hero small{color:#f5b928;letter-spacing:3px}
.hero h1{font-size:48px;margin:18px 0}
.hero p{color:#ccc;max-width:470px;line-height:1.7}
.btn{display:inline-block;background:#f5b928;color:#111;padding:13px 23px;border-radius:6px;text-decoration:none;font-weight:bold;margin-top:23px}
main{padding:35px 7%}
.search{display:flex;gap:10px;margin-bottom:30px}
.search input{flex:1;min-width:0;padding:15px;border-radius:7px;border:1px solid #34394a;background:#171b28;color:white;font-size:15px}
.categories{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:30px}
.categories button{padding:10px 18px;background:#191d2a;border:1px solid #34394a;color:#ddd;border-radius:25px;cursor:pointer}
.categories button.active,.categories button:hover{background:#f5b928;color:#111;border-color:#f5b928}
.section-title{font-size:23px;margin-bottom:20px}
.movies{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
.card{background:#151925;border-radius:10px;overflow:hidden;transition:.25s}
.card:hover{transform:translateY(-6px)}
.poster{height:260px;display:flex;align-items:end;padding:15px;background-size:cover;background-position:center}
.poster h3{font-size:20px;text-shadow:0 2px 8px #000}
.info{padding:14px}
.info p{font-size:13px;color:#aeb3c2;margin:7px 0}
.info a{display:inline-block;color:#f5b928;text-decoration:none;font-size:13px;margin-top:8px}
footer{text-align:center;padding:30px;color:#8c92a3;border-top:1px solid #292d3b;margin-top:40px}
.empty{color:#aaa;grid-column:1/-1;padding:25px}
@media(max-width:800px){.movies{grid-template-columns:repeat(2,1fr)}nav{gap:10px}nav a{font-size:12px}.hero h1{font-size:36px}}
@media(max-width:450px){header{padding:0 4%}.logo{font-size:20px}nav{gap:8px}.hero{padding:55px 6%}.hero h1{font-size:32px}main{padding:25px 4%}.poster{height:220px}}
</style>
</head>

<body>
<header>
  <div class="logo">MOVIE <span>LAND</span></div>
  <nav>
    <a href="#">Home</a>
    <a href="#movies">Movies</a>
    <a href="#about">About</a>
  </nav>
</header>

<section class="hero">
  <small>WELCOME TO MOVIE LAND</small>
  <h1>Discover Your<br>Next Favourite Movie.</h1>
  <p>Explore cinema from around the world. Find movie information, discover new favourites and watch official trailers.</p>
  <a href="#movies" class="btn">Explore Movies →</a>
</section>
